name: page_pal
description: PagePal — Your reading companion. Track, discover, and organize your reading journey.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management (Stable v8)
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navigation (Stable v13)
  go_router: ^13.0.0

  # Network (Stable v5)
  dio: ^5.4.0

  # Local Storage (Classic Hive v2 — stable and widely used)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Firebase (Stable versions before the v4.x breaking changes)
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.13.0

  # UI
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  fl_chart: ^0.66.0
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/